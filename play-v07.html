<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101529;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;justify-content:center;align-items:center}
#app{position:relative;width:min(100vw,calc(100dvh * .5628));height:min(100dvh,calc(100vw / .5628));overflow:hidden;background:#212640;box-shadow:0 0 35px #0009;isolation:isolate}

.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.screen img{display:block;object-fit:fill;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}

#tabs button{background:transparent;color:transparent;font-size:0;border:0;padding:0;cursor:pointer;touch-action:manipulation}
#tabs button:focus-visible{outline:3px solid #ffe875;outline-offset:-6px;border-radius:12px}
#action{position:absolute;left:18%;width:64%;height:11%;top:71%;z-index:5;background:transparent;border:0;cursor:pointer}
#toast{position:absolute;z-index:20;left:7%;width:86%;bottom:17%;padding:12px 14px;border-radius:16px;background:rgba(19,29,72,.96);box-shadow:0 8px 25px #0009;color:white;text-align:center;font-size:13px;font-weight:700;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
#badge{position:absolute;z-index:8;right:7px;top:7px;display:none;color:#fff;font-size:11px;background:#162d6fb8;border:1px solid #9cb5ff55;border-radius:9px;padding:5px 8px}
@media(min-width:700px){#badge{display:block}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

};
const screens=[...document.querySelectorAll('.screen')];
const tabs=[...document.querySelectorAll('[data-tab]')];
const action=document.getElementById('action');
const toast=document.getElementById('toast');
let active='world',toastHandle;
screens.forEach((screen)=>{const img=document.createElement('img');img.src=art[screen.dataset.id];img.alt={'world':'Главный экран с героем в тронном зале','map':'Карта пяти королевств','packs':'Магические наборы карт','shop':'Фэнтезийный магазин','lab':'Лаборатория слияния карт'}[screen.dataset.id];screen.append(img)});
function switchTab(id){
 if(!art[id])return;
 active=id;
 screens.forEach(s=>s.classList.toggle('active',s.dataset.id===id));
 tabs.forEach(b=>{const selected=b.dataset.tab===id;b.setAttribute('aria-current',selected?'page':'false')});
 action.setAttribute('aria-label',id==='world'?'Карта: выбрать поход':id==='packs'?'Открытие пака — превью':id==='lab'?'Слияние карт — превью':'Просмотр дизайна');
}
function hint(message){clearTimeout(toastHandle);toast.textContent=message;toast.classList.add('show');toastHandle=setTimeout(()=>toast.classList.remove('show'),2300)}
tabs.forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
action.addEventListener('click',()=>active==='world'?switchTab('map'):hint('Это визуальный тест меню. Игровые действия пока не подключены.'));
let tx=0,ty=0;
const app=document.getElementById('app');
app.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
app.addEventListener('touchend',e=>{if(e.target.closest('button'))return;const dx=e.changedTouches[0].clientX-tx;const dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.4)return;const order=['world','map','packs','shop','lab'];const idx=order.indexOf(active);switchTab(order[Math.max(0,Math.min(4,idx+(dx<0?1:-1)))]);},{passive:true});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const order=['world','map','packs','shop','lab'];switchTab(order[Math.max(0,Math.min(4,order.indexOf(active)+(e.key==='ArrowRight'?1:-1)))])}});
switchTab('world');
</script>
