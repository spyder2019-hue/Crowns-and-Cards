name: Check Crowns & Cards

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Files and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check local references
        run: python tests/check_project.py

      - name: Check embedded game JavaScript
        run: python tests/check_inline_scripts.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Install browser for visual regression smoke
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Check desktop and mobile game UI
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/cc-browser.log 2>&1 &
          sleep 2
          node tests/browser_visual_v10.cjs

      - name: Save visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crowns-cards-v10-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
