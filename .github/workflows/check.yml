name: Check Crowns & Cards

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Files and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check local references
        run: python tests/check_project.py

      - name: Check embedded game JavaScript
        run: python tests/check_inline_scripts.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
